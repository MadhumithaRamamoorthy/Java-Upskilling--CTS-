<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Colors</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <div class="row g-3">

        <div class="col-md-3">
            <div class="bg-primary text-white p-4 rounded">
                <h4>Users</h4>
                <p>500</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-success text-white p-4 rounded">
                <h4>Sales</h4>
                <p>150</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-warning text-dark p-4 rounded">
                <h4>Orders</h4>
                <p>75</p>
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-danger text-white p-4 rounded">
                <h4>Revenue</h4>
                <p>$5000</p>
            </div>
        </div>

    </div>
</div>

</body>
</html>
